apply plugin: 'com.android.application'
// Kotlin: only for LocalApiPlugin (the localhost API's native socket).
apply plugin: 'org.jetbrains.kotlin.android'

// A3: git-derived versioning.
//   versionCode    = `git rev-list --count HEAD` (monotonic integer).
//   versionName    = exact tag on HEAD (`git describe --tags
//                    --exact-match`, leading 'v' stripped), or a
//                    clearly-marked dev form `0.1.0-dev+<short-sha>`
//                    on untagged commits.
//   Release builds fail closed: assembleRelease / bundleRelease /
//   assemble require an exact tag on HEAD and a clean tree (tracked
//   modifications only; untracked/cap-sync output is ignored).
//   Debug builds always work, so CI can build every commit.
// Git is run with cwd = the android/ root dir; it finds the repo
// upward, which works both from a normal checkout and from the CI
// pipeline's pristine worktree (Gradle runs with cwd $WT/android).
def gitOutput = { String... args ->
    def cmd = ['git']
    cmd.addAll(args)
    def out = new ByteArrayOutputStream()
    def err = new ByteArrayOutputStream()
    def proc = cmd.execute(null, rootDir)
    proc.consumeProcessOutput(out, err)
    proc.waitFor()
    if (proc.exitValue() != 0) {
        return null
    }
    return out.toString().trim()
}

def gitVersionCode = {
    def count = gitOutput('rev-list', '--count', 'HEAD')
    if (count == null || !(count ==~ /\d+/)) {
        throw new GradleException('A3: could not derive versionCode (git rev-list --count HEAD failed)')
    }
    return count.toInteger()
}()

def gitVersionName = {
    def tag = gitOutput('describe', '--tags', '--exact-match', 'HEAD')
    if (tag != null) {
        return tag.startsWith('v') ? tag.substring(1) : tag
    }
    def sha = gitOutput('rev-parse', '--short', 'HEAD')
    if (sha == null) {
        throw new GradleException('A3: could not derive versionName (git rev-parse --short HEAD failed)')
    }
    return '0.1.0-dev+' + sha
}()

gradle.taskGraph.whenReady { graph ->
    def buildsRelease = graph.allTasks.any { t ->
        t.name == 'assembleRelease' || t.name == 'bundleRelease' || t.name == 'assemble'
    }
    if (buildsRelease) {
        def tag = gitOutput('describe', '--tags', '--exact-match', 'HEAD')
        if (tag == null) {
            throw new GradleException('A3: release build requires HEAD to carry an exact git tag; HEAD is untagged')
        }
        def dirty = gitOutput('status', '--porcelain', '--untracked-files=no')
        if (dirty == null) {
            throw new GradleException('A3: release build could not verify a clean tree (git status failed)')
        }
        if (!dirty.isEmpty()) {
            throw new GradleException('A3: release build requires a clean tree (tracked modifications present); commit or stash first')
        }
    }
}

// A4: signed release config. Reads the upload keystore credentials
// from a key.properties file OUTSIDE the repo (ops state dir), located
// via LT_KEYSTORE_PROPERTIES, falling back to the conventional
// repo-relative path ../../../ops/longtable-ci/key.properties (from
// android/: repo -> code -> <LT_ROOT> -> ops/). The file holds
// storeFile/storePassword/keyAlias/keyPassword; it is never committed
// (0600, ops dir only) and its values never appear on a command line.
// When the file is absent (e.g. a developer checkout), no release
// signing config is applied and bundleRelease produces an unsigned
// bundle — the CI signed-release stage fails closed on apksigner
// verify in that case, so an unsigned artifact can never publish.
// The A3 tag/clean-tree gate is untouched: it still refuses release
// builds on untagged or dirty HEADs.
def keystorePropsFile = file(System.getenv('LT_KEYSTORE_PROPERTIES') ?: '../../../ops/longtable-ci/key.properties')
def keystoreProps = new Properties()
def haveSigningKey = false
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
    haveSigningKey = keystoreProps['storeFile'] && keystoreProps['storePassword'] && keystoreProps['keyAlias'] && keystoreProps['keyPassword']
}

android {
    namespace = "kitchen.longtable.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "kitchen.longtable.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode gitVersionCode
        versionName gitVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (haveSigningKey) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (haveSigningKey) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.2.20"
    // SecureStorePlugin (Wave 3): EncryptedSharedPreferences over a
    // Keystore MasterKey - the Android Keystore secret storage.
    // 1.1.0-alpha07: the MasterKey (singular) Builder API used by
    // SecureStorePlugin arrived in 1.1.0-alpha01; 1.0.0 only has the
    // deprecated MasterKeys alias-string API, which does not compile
    // against this plugin's MasterKey-based calls.
    implementation "androidx.security:security-crypto:1.1.0-alpha07"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
