// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        // Kotlin for the app module's one native plugin (LocalApiPlugin).
        // 2.2.20 matches @capacitor/android's own kotlin_version default;
        // the stdlib is already in the dependency graph via androidx.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

// The google() repositories above STAY (Wave 5A): the Android Gradle
// Plugin (com.android.tools.build:gradle) is published to Google Maven,
// not Maven Central — removing google() breaks the build. What was
// removed is only the unused proprietary google-services classpath
// (com.google.gms:google-services:4.4.4): no google-services.json exists
// in the repo, no Firebase code exists anywhere in the app, and the
// app module only ever applied that plugin conditionally when the file
// was present (see the removed block in android/app/build.gradle).
// Nothing in the app uses Firebase, push notifications, or any Google
// service.

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
